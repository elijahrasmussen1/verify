<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeColo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:    #22c55e;
      --green-dk: #16a34a;
      --nav-bg:   rgba(10, 14, 10, 0.82);
      --footer-bg:#0a0d0a;
    }

    html, body {
      min-height: 100%;
      background: #080d08;
      color: #e8f0e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Background glow ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 55% at 50% 38%,
        rgba(20, 90, 20, 0.55) 0%,
        rgba(10, 40, 10, 0.25) 45%,
        transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ════════════════════════════
       NAV
    ════════════════════════════ */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      z-index: 100;
    }

    /* Logo */
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .nav-logo img {
      height: 34px;
      width: auto;
      object-fit: contain;
    }

    /* Status pill */
    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 600;
      color: var(--green);
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .status-pill::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      flex-shrink: 0;
    }

    /* Nav divider */
    .nav-divider {
      width: 1px;
      height: 22px;
      background: rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    /* Help icon */
    .nav-help {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #9ca3af;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
      transition: border-color .2s, color .2s;
    }

    .nav-help:hover { border-color: rgba(255,255,255,0.3); color: #e8f0e8; }

    /* Nav links */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      justify-content: center;
    }

    .nav-links a {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      color: #9ca3af;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(255,255,255,0.07);
      color: #e8f0e8;
    }

    .nav-links a.active {
      border-bottom: 2px solid var(--green);
      border-radius: 0;
      padding-bottom: 4px;
    }

    .nav-icon {
      font-size: 14px;
      opacity: 0.85;
    }

    /* Right side placeholder */
    .nav-right {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    /* ════════════════════════════
       HERO
    ════════════════════════════ */
    .hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 52px;
      padding-bottom: 64px;
      text-align: center;
    }

    /* ── Hero stage: characters + logo as one overlapping unit ── */
    .hero-stage {
      position: relative;
      width: min(680px, 92vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 14px;
    }

    .stage-characters {
      width: 100%;
      height: auto;
      display: block;
      position: relative;
      z-index: 1;
      /* Green halo glow to help the characters melt into the background */
      filter: drop-shadow(0 0 90px rgba(20, 160, 20, 0.35))
              drop-shadow(0 0 30px rgba(10, 100, 10, 0.4));
    }

    .stage-logo {
      position: relative;
      z-index: 2;
      width: min(430px, 72%);
      /* Pull the logo up ~36% of the stage width — sits deep inside the characters */
      margin-top: -36%;
      margin-bottom: 0;
      filter: drop-shadow(0 6px 40px rgba(0, 0, 0, 0.9))
              drop-shadow(0 0 20px rgba(0, 0, 0, 0.6));
    }

    /* Title + subtitle */
    .hero-title {
      font-size: clamp(22px, 3.5vw, 30px);
      font-weight: 700;
      color: #e8f0e8;
      letter-spacing: 0.01em;
      margin-bottom: 6px;
    }

    .hero-sub {
      font-size: clamp(13px, 2vw, 15px);
      color: #6b8f6b;
      margin-bottom: 28px;
    }

    /* CTA buttons */
    .hero-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity .2s, transform .15s;
    }

    .btn:hover { opacity: .85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-outline-blue {
      background: rgba(88, 101, 242, 0.15);
      border: 1px solid rgba(88, 101, 242, 0.45);
      color: #a5b4fc;
    }

    .btn-green {
      background: var(--green);
      color: #fff;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
    }

    .btn-green:hover { background: var(--green-dk); opacity: 1; }

    .btn-outline-tan {
      background: rgba(180, 140, 60, 0.12);
      border: 1px solid rgba(180, 140, 60, 0.4);
      color: #d4a843;
    }

    /* Social icons */
    .hero-socials {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .social-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 16px;
      color: #9ca3af;
      transition: background .2s, color .2s, border-color .2s;
    }

    .social-icon:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.25);
      color: #e8f0e8;
    }

    /* ════════════════════════════
       FOOTER
    ════════════════════════════ */
    footer {
      position: relative;
      z-index: 1;
      background: var(--footer-bg);
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      flex-wrap: wrap;
    }

    .footer-section {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #6b7280;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: color .2s;
    }

    .footer-section:hover { color: #9ca3af; }

    .footer-icon { font-size: 15px; }

    /* ════════════════════════════
       RESPONSIVE
    ════════════════════════════ */
    @media (max-width: 600px) {
      .nav-links a span { display: none; }
      .nav-links a { padding: 6px 8px; }
      footer { gap: 24px; padding: 16px 20px; }
      .hero-characters { margin-bottom: -28px; }
    }
  </style>
</head>
