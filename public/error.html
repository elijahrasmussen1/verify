<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AquaForge — Error</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #07111e;
      color: #e0eaf5;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glow {
      position: fixed;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(180, 40, 40, 0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-bottom: 110px;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }

    .badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(140deg, #6b1515 0%, #3a0a0a 100%);
      box-shadow: 0 0 28px rgba(200, 40, 40, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes pop {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #c6ddf0;
      letter-spacing: 0.02em;
    }

    .message {
      font-size: 14px;
      color: #c07070;
      line-height: 1.6;
      background: rgba(180, 40, 40, 0.07);
      border: 1px solid rgba(180, 40, 40, 0.18);
      border-radius: 8px;
      padding: 12px 18px;
      max-width: 340px;
    }

    a.btn {
      display: inline-block;
      background: #1a4f7a;
      color: #c8dff0;
      padding: 11px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: opacity .2s;
    }

    a.btn:hover { opacity: .8; }

    .hint {
      font-size: 11.5px;
      color: #2f5a72;
      letter-spacing: 0.03em;
    }

    /* Waves */
    .waves {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 130px;
      pointer-events: none;
    }

    .wave { position: absolute; bottom: 0; left: 0; width: 200%; height: 100%; }
    .wave svg { width: 50%; height: 100%; display: inline-block; vertical-align: bottom; }
    .wave-1 { animation: drift 9s linear infinite;   opacity: 0.18; }
    .wave-2 { animation: drift 14s linear infinite reverse; opacity: 0.11; top: 12px; }
    .wave-3 { animation: drift 19s linear infinite;  opacity: 0.07; top: 24px; }

    @keyframes drift {
      from { transform: translateX(0);    }
      to   { transform: translateX(-50%); }
    }

    @media (max-width: 480px) { h1 { font-size: 21px; } }
  </style>
</head>
<body>

  <div class="glow"></div>

  <div class="card">
    <div class="badge">⚠</div>
    <h1>Something went wrong</h1>
    <div class="message" id="js-message">An unexpected error occurred.</div>
    <a class="btn" href="/discord/verify">Try again</a>
    <div class="hint">An AquaForge Dev will NEVER ask for your password.</div>
  </div>

  <div class="waves">
    <div class="wave wave-1">
      <svg viewBox="0 0 1440 130" preserveAspectRatio="none">
        <path fill="#1a7bbf" d="M0,70 C240,30 480,110 720,70 C960,30 1200,110 1440,70 L1440,130 L0,130 Z"/>
      </svg><svg viewBox="0 0 1440 130" preserveAspectRatio="none">
        <path fill="#1a7bbf" d="M0,70 C240,30 480,110 720,70 C960,30 1200,110 1440,70 L1440,130 L0,130 Z"/>
      </svg>
    </div>
    <div class="wave wave-2">
      <svg viewBox="0 0 1440 130" preserveAspectRatio="none">
        <path fill="#2496d4" d="M0,80 C180,40 360,115 540,80 C720,45 900,115 1080,80 C1260,45 1350,90 1440,80 L1440,130 L0,130 Z"/>
      </svg><svg viewBox="0 0 1440 130" preserveAspectRatio="none">
        <path fill="#2496d4" d="M0,80 C180,40 360,115 540,80 C720,45 900,115 1080,80 C1260,45 1350,90 1440,80 L1440,130 L0,130 Z"/>
      </svg>
    </div>
    <div class="wave wave-3">
      <svg viewBox="0 0 1440 130" preserveAspectRatio="none">
        <path fill="#30a8e0" d="M0,90 C300,55 600,120 900,90 C1100,68 1280,105 1440,90 L1440,130 L0,130 Z"/>
      </svg><svg viewBox="0 0 1440 130" preserveAspectRatio="none">
        <path fill="#30a8e0" d="M0,90 C300,55 600,120 900,90 C1100,68 1280,105 1440,90 L1440,130 L0,130 Z"/>
      </svg>
    </div>
  </div>

  <script>
    // Show the error message from the query string
    const msg = new URLSearchParams(window.location.search).get('message');
    if (msg) document.getElementById('js-message').textContent = decodeURIComponent(msg);
  </script>
</body>
</html>
